<div class="container mt-4">
  <h2>Your Cart</h2>

  <div *ngFor="let item of items" class="card p-3 mb-2">
    <h5>{{ item.title }}</h5>
    <p>${{ item.price }}</p>

    
    <button class="btn btn-danger btn-sm" (click)="remove(item._id)">
      Remove
    </button>
  </div>

  <h4 class="mt-3">Total: ${{ getTotal() }}</h4>
</div>
